<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the on-screen keyboard shrinks the page, so the input dock stays above it (UI-043). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <!-- Lets the browser draw its own controls and scrollbars to match until the theme applies (UI-033). -->
    <meta name="color-scheme" content="light dark" />
    <title>Mythos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
